[project]
name = "tw-signal-engine"
version = "0.1.0"
description = "Taiwan stock intraday momentum backtest engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "pyarrow>=23.0.1",
    "pydantic>=2.0",
    "python-socketio>=5.16.1",
    "redis>=7.3.0",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tw_signal_engine"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "redis", "redis.*", "socketio", "socketio.*", "engineio", "engineio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: parity checks against archived C++ replay baselines",
]
