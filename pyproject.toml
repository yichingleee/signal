[project]
name = "tw-signal-engine"
version = "0.1.0"
description = "Taiwan stock intraday momentum backtest engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
live = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-socketio>=5.11",
    "redis>=5.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tw_signal_engine"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: parity checks against archived C++ replay baselines",
]
